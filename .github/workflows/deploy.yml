# Деплой на VPS:
# 1. Сборка prod-стейджа из Dockerfile.
# 2. Push в GHCR (ghcr.io/<owner>/<repo>) с тегами :latest и :sha-<short>.
# 3. SSH на сервер → scp docker-compose.prod.yml → docker compose pull + up -d.
#
# Триггеры: push в main (авто) и workflow_dispatch (кнопка в Actions UI).
# Concurrency не даёт двум деплоям ехать одновременно.
#
# Требуемые GitHub Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST       — IP или DNS сервера
#   SSH_USER       — пользователь (обычно deploy)
#   SSH_KEY        — приватный SSH-ключ (полный текст id_ed25519)
#   SSH_PORT       — порт SSH (опционально, дефолт 22)
#   DEPLOY_PATH    — куда положить compose, напр. /home/deploy/RateYou
#   GHCR_PAT       — Personal Access Token c read:packages, нужен серверу
#                    для docker pull из приватного GHCR. Если репо публичный
#                    и образ открыт — можно оставить пустым.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # требуется для push в GHCR через GITHUB_TOKEN
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :latest — что тянет сервер по умолчанию;
          # :sha-xxxxxxx — для пиннинга/отката.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push (prod stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-cache: следующий билд переиспользует слои предыдущего.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.prod.yml

      - name: Pull image and restart on server
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; \
             cd ${{ secrets.DEPLOY_PATH }}; \
             echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin; \
             docker compose -f docker-compose.prod.yml pull; \
             docker compose -f docker-compose.prod.yml up -d; \
             docker image prune -f"
